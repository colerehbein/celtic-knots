name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # celtic-knots.html is the self-contained single-file build —
          # everything (CSS + JS) is already inlined, so it deploys as-is.
          cp celtic-knots.html _site/index.html
          cp CNAME _site/CNAME
          # PWA assets: manifest, icon and the cache-first service worker.
          # public/ is vite's static dir, so these deploy unmodified.
          cp public/manifest.webmanifest _site/manifest.webmanifest
          cp public/sw.js _site/sw.js
          cp public/icon.svg _site/icon.svg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
